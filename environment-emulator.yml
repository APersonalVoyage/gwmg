# Environment for TRAINING and RUNNING the emulators, and for the accelerated
# pipeline. It contains CosmoSIS and CosmoPower but NOT classy: TensorFlow pins
# numpy<1.25 while a modern classy build wants numpy 2.x, so the two cannot share
# an environment. That is fine, because when the emulator is in use hi_class is
# not needed. Training data is generated in the gw-hiclass environment and passed
# across as .npy/.npz files on disk.
#
#   conda env create -f environment-emulator.yml
#   conda activate gw-emu
name: gw-emu
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy>=1.24,<1.25      # upper bound imposed by TensorFlow via CosmoPower
  - scipy
  - cosmosis               # so the emulated pipeline can be run here too
  - camb                   # required by the CosmoSIS consistency module
  - pytest
  - pip
  - pip:
      - cosmopower         # pulls in TensorFlow
      - -e .
