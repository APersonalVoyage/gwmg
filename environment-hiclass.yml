# Environment for the EXACT pipeline: CosmoSIS + hi_class (compiled classy).
# hi_class itself is built from source afterwards; see docs/install.md.
#
#   conda env create -f environment-hiclass.yml
#   conda activate gw-hiclass
name: gw-hiclass
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy
  - scipy
  - cython
  - gsl
  - gcc                    # linux; on macOS the Xcode command line tools suffice
  - compilers
  - cosmosis
  - cosmosis-build-standard-library
  - matplotlib
  - astropy
  - camb                   # required by the CosmoSIS consistency module
  - pytest
  - pip
  - pip:
      - -e .
