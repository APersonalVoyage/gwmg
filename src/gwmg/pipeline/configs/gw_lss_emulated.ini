; Emulated GW + LSS chain: identical to gw_lss_emcee.ini but with the hi_class
; module replaced by the CosmoPower emulator drop-in (emulator_interface.py).
; Runs in the gw-e2e environment (cosmosis + cosmopower, no classy). Uses the
; SAME values file and likelihoods as the exact chain, so the two are directly
; comparable.
;
; Portable paths:
;   COSMOSIS_SRC_DIR : root of the cosmosis-standard-library checkout
;   PIPELINE_DIR     : absolute path to this modern_pipeline / package config dir
;   GWMG_EMU         : dir holding the trained emulator subdirectories

[runtime]
sampler = emcee

[emcee]
walkers = 32
samples = 4000    ; the emulator is fast, so run a long, converged chain
nsteps  = 50

[output]
filename  = ${PIPELINE_DIR}/output/gw_lss_emulated.txt
format    = text
verbosity = quiet

[pipeline]
modules = consistency emulator planck_py boss 6dfgs wigglez_bao mgs_bao dgw
values  = ${PIPELINE_DIR}/configs/values_horndeski.ini
extra_output = cosmological_parameters/sigma_8
likelihoods  = dgw boss 6dfgs wigglez_bao mgs_bao planck
quiet = T
debug = F
timing = F

[consistency]
file = ${COSMOSIS_SRC_DIR}/cosmosis-standard-library/utility/consistency/consistency_interface.py

; The emulator drop-in. Replaces [hi_class]. Populates cmb_cl, matter sigma_8,
; growth fsigma_8, distances and the GW-distance ratio from the trained networks
; plus an exact LCDM background. Out-of-box proposals are rejected.
[emulator]
file = ${PIPELINE_DIR}/modules/emulator_interface.py
cmb_model    = ${GWMG_EMU}/emulators_mg_cmb/emu_cl_tt
logpk_model  = ${GWMG_EMU}/emulators_smart/emu_logpk
growth_model = ${GWMG_EMU}/emulators_growth/emu_fsigma8
zmax = 3.0
dz   = 0.01

[dgw]
file     = ${PIPELINE_DIR}/modules/dgw.py
dirname  = ${PIPELINE_DIR}/data/gw
filename = ligo_data.txt

[planck_py]
file = ${COSMOSIS_SRC_DIR}/cosmosis-standard-library/likelihood/planck_py/planck_py_interface.py
year = 2015
spectra = TT
use_low_ell_bins = T

[boss]
file = ${COSMOSIS_SRC_DIR}/cosmosis-standard-library/likelihood/boss/boss_rsd.py
mode = 1

[6dfgs]
file = ${COSMOSIS_SRC_DIR}/cosmosis-standard-library/likelihood/6dfgs/6dfgs.py
bao_likelihood = F
rsd_likelihood = T

[wigglez_bao]
file = ${COSMOSIS_SRC_DIR}/cosmosis-standard-library/likelihood/wigglez_bao/wigglez_bao.py

[mgs_bao]
file = ${COSMOSIS_SRC_DIR}/cosmosis-standard-library/likelihood/mgs_bao/mgs_bao.py
