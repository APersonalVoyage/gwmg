; Full GW + LSS constraint chain (the thesis' main run), modernised.
; consistency -> hi_class -> [Planck + LSS likelihoods] -> dgw (GW sirens)
;
; Portable paths via environment variables (see modern_pipeline/README.md):
;   COSMOSIS_SRC_DIR : root of the cosmosis-standard-library checkout
;   PIPELINE_DIR     : absolute path to this modern_pipeline/ directory
;   HICLASS_DIR      : path to the built hi_class (for bbn/sBBN.dat)

[runtime]
sampler = emcee

; Quick single-evaluation smoke test before committing to the full chain:
; set [runtime] sampler = test above and uncomment this section.
;[test]
;save_dir = ${PIPELINE_DIR}/output/gw_lss_test
;fatal_errors = T

[emcee]
walkers = 32
samples = 500
nsteps  = 20   ; output write cadence: flush every 20 steps (sooner output + crash-safe checkpoints)

[output]
filename  = ${PIPELINE_DIR}/output/gw_lss_horndeski.txt
format    = text
verbosity = debug

[pipeline]
modules = consistency hi_class planck_py boss 6dfgs wigglez_bao mgs_bao dgw
values  = ${PIPELINE_DIR}/configs/values_horndeski.ini
extra_output = cosmological_parameters/sigma_8
likelihoods  = dgw boss 6dfgs wigglez_bao mgs_bao planck
quiet = F
debug = F
timing = F

[consistency]
file = ${COSMOSIS_SRC_DIR}/cosmosis-standard-library/utility/consistency/consistency_interface.py

[hi_class]
file = ${PIPELINE_DIR}/modules/hi_class_interface.py
sBBN_file = ${HICLASS_DIR}/external/bbn/sBBN.dat
gravity_model   = propto_omega
expansion_model = lcdm
lmax = 2600
zmax = 15.0
; GW-distance integrand uses physical alpha_M with NO 1/Omega_smg division,
; matching the dissertation's eq 2.10 and the alpha_M definition (section 2.1).
; The original code's division was a bug (author's own "why divide?" comment).
; Set to T ONLY to reproduce the exact printed Table 5.1 numbers.
alpha_m_over_omega_smg = F

[dgw]
file     = ${PIPELINE_DIR}/modules/dgw.py
dirname  = ${PIPELINE_DIR}/data/gw
filename = ligo_data.txt

; planck2015_simple was removed from the modern standard library. planck_py
; (planck-lite-py) is the modern lightweight replacement; it reads cmb_cl
; TT/TE/EE which hi_class_interface.py writes. Needs: pip install planck-lite-py
; year=2015 keeps this close to the thesis' Planck 2015 constraint.
[planck_py]
file = ${COSMOSIS_SRC_DIR}/cosmosis-standard-library/likelihood/planck_py/planck_py_interface.py
year = 2015
spectra = TTTEEE
use_low_ell_bins = T

[boss]
file = ${COSMOSIS_SRC_DIR}/cosmosis-standard-library/likelihood/boss/boss_rsd.py
mode = 1 ; include fsigma8 constraint

; 6dfgs redesigned its options: the old `mode` now hard-errors. rsd_likelihood=T
; selects the fsigma8 (RSD) constraint the thesis' `mode=1` used. bao_likelihood
; defaults to T, and the module refuses RSD+BAO together (no joint covariance)
; so it must be turned off explicitly.
[6dfgs]
file = ${COSMOSIS_SRC_DIR}/cosmosis-standard-library/likelihood/6dfgs/6dfgs.py
bao_likelihood = F
rsd_likelihood = T

[wigglez_bao]
file = ${COSMOSIS_SRC_DIR}/cosmosis-standard-library/likelihood/wigglez_bao/wigglez_bao.py

[mgs_bao]
file = ${COSMOSIS_SRC_DIR}/cosmosis-standard-library/likelihood/mgs_bao/mgs_bao.py
