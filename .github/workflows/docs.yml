name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install mkdocs mkdocs-material
      - name: Regenerate the pages that mirror repo files
        run: |
          python - <<'PY'
          import shutil
          s = open("README.md").read()
          s = s.replace("](docs/", "](").replace("](pretrained/README.md)", "](pretrained.md)")
          s = s.replace("](examples)", "](https://github.com/APersonalVoyage/gwmg/tree/main/examples)")
          s = s.replace("](LICENSE)", "](https://github.com/APersonalVoyage/gwmg/blob/main/LICENSE)")
          s = s.replace("](environment.yml)", "](https://github.com/APersonalVoyage/gwmg/blob/main/environment.yml)")
          s = s.replace("](pretrained)", "](pretrained.md)")
          open("docs/index.md", "w").write(s)
          shutil.copy("pretrained/README.md", "docs/pretrained.md")
          PY
      - name: Build
        run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
