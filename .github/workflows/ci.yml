name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e .[test]
      - name: Run tests
        run: pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build
      - name: Check the wheel bundles configs and data
        run: |
          python - <<'PY'
          import glob, zipfile
          whl = sorted(glob.glob("dist/*.whl"))[-1]
          names = zipfile.ZipFile(whl).namelist()
          need = [
              "gwmg/pipeline/configs/gw_lss_emcee.ini",
              "gwmg/pipeline/data/gw/ligo_data.txt",
              "gwmg/pipeline/modules/hi_class_interface.py",
          ]
          for n in need:
              assert any(x.endswith(n) for x in names), "missing %s in wheel" % n
          print("wheel bundles configs, data and modules OK")
          PY
